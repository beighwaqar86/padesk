<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaDesk - My Complete Order History</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #f4f6f9; padding: 12px; font-family: sans-serif; margin: 0;">

    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
        
        <!-- Cleanly Aligned Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 2px solid #edf2f7; padding-bottom: 12px;">
            <div>
                <h2 style="margin: 0; color: #1a202c; font-size: 1.2rem;">📋 My Order History</h2>
                <small id="customer-subtitle" style="color: #718096; font-size: 0.75rem;">Loading account...</small>
            </div>
            <a href="index.html" style="background: #edf2f7; color: #2d3748; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.75rem; white-space: nowrap;">← Back to Store</a>
        </div>

        <!-- Full Orders Container -->
        <div id="full-orders-container">
            <p style="text-align: center; color: #718096; padding: 30px; font-size: 0.85rem;">⏳ Fetching your complete records...</p>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://cziefuaclocpwicwjprb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_j_MkiOlGUZOBsR8TSxIM1w_pnQ_B1xx";
        let db;

        window.onload = function() {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const phone = localStorage.getItem("padesk_phone");
            
            if (!phone) {
                alert("No active session found. Please enter your phone number on the store page first.");
                window.location.href = "index.html";
                return;
            }

            const title = localStorage.getItem("padesk_title") || "";
            const lastName = localStorage.getItem("padesk_last_name") || localStorage.getItem("padesk_first_name") || "Shopper";
            document.getElementById("customer-subtitle").innerText = `Account: ${title} ${lastName} (${phone})`;

            loadFullOrderHistory(phone);
        };

        async function loadFullOrderHistory(phone) {
            const { data: orders, error } = await db
                .from('orders')
                .select('*')
                .eq('customer_phone', phone)
                .order('id', { ascending: false });

            const container = document.getElementById("full-orders-container");

            if (error || !orders || orders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 30px; color: #718096;">
                        <h3 style="font-size: 1rem; margin-bottom: 6px;">No orders found</h3>
                        <p style="font-size: 0.78rem;">You haven't placed any office combo orders yet.</p>
                        <a href="index.html" style="background: #0baf65; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 8px; font-size: 0.8rem;">Start Shopping</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(o => {
                const orderDate = o.created_at ? new Date(o.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
                const orderNum = o.order_number || (`#ORD-${o.id}`);
                const status = o.fulfillment_status || 'Order Placed';
                const items = o.order_items_json || [];
                const total = parseFloat(o.total_amount || 0).toFixed(2);
                
                const statusColor = status === 'Delivered' ? '#0baf65' : (status === 'Cancelled' ? '#e53e3e' : '#3182ce');

                return `
                    <div style="background: #ffffff; border: 1px solid #cbd5e0; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.02);">
                        <!-- Order Top Banner -->
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #edf2f7; padding-bottom: 10px; margin-bottom: 10px;">
                            <div>
                                <h3 style="margin: 0 0 2px 0; color: #1a202c; font-size: 0.95rem;">${orderNum}</h3>
                                <small style="color: #718096; font-size: 0.7rem;">📅 ${orderDate}</small>
                            </div>
                            <div style="text-align: right;">
                                <span style="background: ${statusColor}15; color: ${statusColor}; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 0.68rem; text-transform: uppercase; display: inline-block; white-space: nowrap;">${status}</span>
                                <div style="font-weight: 800; color: #0baf65; font-size: 0.95rem; margin-top: 4px;">K ${total}</div>
                            </div>
                        </div>

                        <!-- Delivery & Payment Metadata Box -->
                        <div style="display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; color: #4a5568; background: #f8fafc; padding: 8px 10px; border-radius: 6px; margin-bottom: 10px;">
                            <div>📍 <strong>Delivery:</strong> ${o.delivery_location || '-'}</div>
                            <div>💳 <strong>Payment:</strong> ${o.payment_method || 'CoD'} (${o.payment_status || 'Pending'})</div>
                        </div>

                        <!-- Shortened Title & Items Table -->
                        <div style="font-weight: bold; font-size: 0.78rem; color: #2d3748; margin-bottom: 6px;">📦 Items (${items.length}):</div>
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; font-size: 0.72rem; border-collapse: collapse; min-width: 320px;">
                                <thead>
                                    <tr style="border-bottom: 1px solid #cbd5e0; text-align: left; color: #718096;">
                                        <th style="padding: 4px; width: 40%;">Product</th>
                                        <th style="padding: 4px; width: 15%;">Code</th>
                                        <th style="padding: 4px; text-align: center; width: 10%;">Qty</th>
                                        <th style="padding: 4px; text-align: right; width: 17%;">Price</th>
                                        <th style="padding: 4px; text-align: right; width: 18%;">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${items.map(item => {
                                        const p = item.product || {};
                                        const price = parseFloat(p.deal_price || p.price || 0);
                                        const lineTotal = price * (item.qty || 1);
                                        return `
                                            <tr style="border-bottom: 1px solid #f7fafc;">
                                                <td style="padding: 6px 4px; font-weight: 600; color: #2d3748;">${p.name || 'Item'}</td>
                                                <td style="padding: 6px 4px; color: #718096;">${p.product_code || '-'}</td>
                                                <td style="padding: 6px 4px; text-align: center; color: #4a5568;">${item.qty || 1}</td>
                                                <td style="padding: 6px 4px; text-align: right; color: #4a5568;">K ${price.toFixed(2)}</td>
                                                <td style="padding: 6px 4px; text-align: right; font-weight: bold; color: #0baf65;">K ${lineTotal.toFixed(2)}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
