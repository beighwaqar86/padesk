<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaDesk - My Complete Order History</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #f8fafc; padding: 20px; font-family: sans-serif;">

    <div style="max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.05);">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #edf2f7; padding-bottom: 12px;">
            <div>
                <h2 style="margin: 0; color: #1a202c;">📋 My Order History</h2>
                <small id="customer-subtitle" style="color: #718096;">Loading account profile...</small>
            </div>
            <a href="index.html" style="background: #edf2f7; color: #2d3748; padding: 8px 14px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.85rem;">← Back to Store</a>
        </div>

        <div id="full-orders-container">
            <p style="text-align: center; color: #718096; padding: 30px;">⏳ Fetching your complete purchase records...</p>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://cziefuaclocpwicwjprb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_j_MkiOlGUZOBsR8TSxIM1w_pnQ_B1xx";
        let db;

        window.onload = function() {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const phone = localStorage.getItem("padesk_phone");
            
            if (!phone) {
                alert("No active session found. Please enter your phone number on the store page first.");
                window.location.href = "index.html";
                return;
            }

            const title = localStorage.getItem("padesk_title") || "";
            const lastName = localStorage.getItem("padesk_last_name") || localStorage.getItem("padesk_first_name") || "Shopper";
            document.getElementById("customer-subtitle").innerText = `Account: ${title} ${lastName} (${phone})`;

            loadFullOrderHistory(phone);
        };

        async function loadFullOrderHistory(phone) {
            const { data: orders, error } = await db
                .from('orders')
                .select('*')
                .eq('customer_phone', phone)
                .order('id', { ascending: false });

            const container = document.getElementById("full-orders-container");

            if (error || !orders || orders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #718096;">
                        <h3>No orders found</h3>
                        <p style="font-size: 0.85rem;">You haven't placed any office combo orders yet.</p>
                        <a href="index.html" style="background: #0baf65; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 10px;">Start Shopping</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(o => {
                const orderDate = o.created_at ? new Date(o.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
                const orderNum = o.order_number || (`#ORD-${o.id}`);
                const status = o.fulfillment_status || 'Order Placed';
                const items = o.order_items_json || [];
                const total = parseFloat(o.total_amount || 0).toFixed(2);
                
                const statusColor = status === 'Delivered' ? '#0baf65' : (status === 'Cancelled' ? '#e53e3e' : '#3182ce');

                return `
                    <div style="background: #ffffff; border: 1px solid #cbd5e0; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.03);">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #edf2f7; padding-bottom: 12px; margin-bottom: 12px;">
                            <div>
                                <h3 style="margin: 0 0 4px 0; color: #1a202c; font-size: 1.1rem;">${orderNum}</h3>
                                <small style="color: #718096;">📅 Placed on: ${orderDate}</small>
                            </div>
                            <div style="text-align: right;">
                                <span style="background: ${statusColor}15; color: ${statusColor}; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase;">${status}</span>
                                <div style="font-weight: 800; color: #0baf65; font-size: 1.1rem; margin-top: 6px;">K ${total}</div>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; color: #4a5568; background: #f8fafc; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;">
                            <div>📍 <strong>Delivery Point:</strong> ${o.delivery_location || '-'}</div>
                            <div>💳 <strong>Payment:</strong> ${o.payment_method || 'CoD'} (${o.payment_status || 'Pending'})</div>
                        </div>

                        <h4 style="margin: 0 0 8px 0; font-size: 0.9rem; color: #2d3748;">📦 Itemized Product Breakdown (${items.length} items)</h4>
                        <table style="width: 100%; font-size: 0.82rem; border-collapse: collapse;">
                            <thead>
                                <tr style="border-bottom: 2px solid #e2e8f0; text-align: left; color: #718096;">
                                    <th style="padding: 6px;">Product Name</th>
                                    <th style="padding: 6px;">Code</th>
                                    <th style="padding: 6px; text-align: center;">Qty</th>
                                    <th style="padding: 6px; text-align: right;">Unit Price</th>
                                    <th style="padding: 6px; text-align: right;">Total Value</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map(item => {
                                    const p = item.product || {};
                                    const price = parseFloat(p.deal_price || p.price || 0);
                                    const lineTotal = price * (item.qty || 1);
                                    return `
                                        <tr style="border-bottom: 1px solid #f7fafc;">
                                            <td style="padding: 8px 6px; font-weight: 600; color: #2d3748;">${p.name || 'Item'}</td>
                                            <td style="padding: 8px 6px; color: #718096;">${p.product_code || '-'}</td>
                                            <td style="padding: 8px 6px; text-align: center; color: #4a5568;">${item.qty || 1}</td>
                                            <td style="padding: 8px 6px; text-align: right; color: #4a5568;">K ${price.toFixed(2)}</td>
                                            <td style="padding: 8px 6px; text-align: right; font-weight: bold; color: #0baf65;">K ${lineTotal.toFixed(2)}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
