<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaDesk - Direct Office Combos</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Top App Bar -->
    <header class="app-header">
        <div class="brand">
            <span class="brand-logo">📦</span>
            <div>
                <h1>PaDesk</h1>
                <small>Office Gate Delivery</small>
            </div>
        </div>
    </header>

    <!-- Delivery Day Ticker -->
    <div class="delivery-ticker">
        🚛 Delivery: Tuesdays & Thursdays | Min Combo: 3 Items & K249 Total
    </div>

    <!-- Interactive Hero Banner Slider Area -->
    <section class="banner-section">
        <div id="banner-carousel" class="banner-carousel">
            <!-- Dynamic Banner Cards Load Here -->
        </div>
        <div id="slider-dots" class="slider-dots">
            <!-- Dynamic Pagination Dots Render Here -->
        </div>
    </section>

    <!-- Primary Category Circle Shortcuts -->
    <div class="circle-shortcuts-wrapper">
        <div class="circle-shortcuts-container" id="category-circles">
            <!-- Dynamic Category Circles Render Here -->
        </div>

        <!-- Sub-Category Shortcuts -->
        <div class="circle-shortcuts-container sub-circles" id="subcategory-circles" style="display: none;">
            <!-- Dynamic Sub-category Circles Render Here -->
        </div>
    </div>

    <!-- Search Bar & Sidebar Filter Toggle Bar -->
    <div class="search-filter-bar">
        <input 
            type="text" 
            id="search-input" 
            placeholder="🔍 Search name, code, category, brand..." 
            oninput="applyFilters()"
        >
        <button type="button" class="btn-filter-toggle" onclick="toggleSidebar()">
            ⚙️ Filters
        </button>
    </div>

    <!-- Product Grid -->
    <main class="content-container">
        <h3 class="section-title">Build Your Custom Combo</h3>
        <div id="product-list" class="product-grid">Loading products...</div>
    </main>

    <!-- Sticky Bottom Cart Sheet -->
    <section id="cart-section" class="cart-card">
        <h3>🛒 Your Combo Selection</h3>
        <ul id="cart-items"></ul>
        
        <div class="combo-tracker">
            <div id="item-count-rule" class="rule-badge">❌ Items: 0 / 3 min</div>
            <div id="price-rule" class="rule-badge">❌ Total: K 0.00 / K 249.00 min</div>
        </div>

        <form id="checkout-form" onsubmit="handleCheckout(event)">
            <label for="workplace-select">Select Office Delivery Point:</label>
            <select id="workplace-select" required>
                <option value="">-- Choose your office --</option>
                <option value="New Government Complex">New Government Complex (Independence Ave)</option>
                <option value="Ministry of Finance">Ministry of Finance (Haile Selassie Ave)</option>
                <option value="Zanaco HQ">Zanaco HQ (Cairo Road)</option>
            </select>

            <label for="customer-phone">WhatsApp Contact Number:</label>
            <input type="tel" id="customer-phone" placeholder="e.g. 0977123456" required>

            <button type="submit" id="checkout-btn" class="btn-primary" disabled>Build Min Combo (3 Items & K249) to Order</button>
        </form>
    </section>

    <!-- Sliding Sidebar Overlay -->
    <div id="filter-sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Off-Canvas Filter Drawer -->
    <aside id="filter-sidebar" class="filter-sidebar">
        <div class="sidebar-header">
            <h3>Filter Products</h3>
            <button type="button" class="btn-close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>

        <div class="sidebar-content">
            <div class="filter-group">
                <label>Category</label>
                <select id="filter-category" onchange="handleCategoryChange()">
                    <option value="ALL">All Categories</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Sub-Category</label>
                <select id="filter-subcategory" onchange="applyFilters()">
                    <option value="ALL">All Sub-Categories</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Brand</label>
                <select id="filter-brand" onchange="applyFilters()">
                    <option value="ALL">All Brands</option>
                </select>
            </div>

            <button type="button" class="btn-primary" onclick="toggleSidebar()" style="margin-top: 20px;">
                Apply Filters
            </button>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
