<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaDesk - Direct Office Combos</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Top App Bar -->
    <header class="app-header">
        <div class="brand">
            <span class="brand-logo">📦</span>
            <div>
                <h1>PaDesk</h1>
                <small>Office Gate Delivery</small>
            </div>
        </div>
    </header>

    <!-- Ticker -->
    <div class="delivery-ticker">
        🚛 Delivery: Tuesdays & Thursdays | Min Combo: 3 Items & K249 Total
    </div>

    <!-- Main Banner Carousel Area -->
    <section class="banner-section">
        <div id="banner-carousel" class="banner-carousel">
            <!-- Dynamic Banners Load Here -->
        </div>
    </section>

    <!-- Dynamic Category & Brand Filter Bar -->
    <section class="filter-section">
        <div class="filter-group">
            <label>Category</label>
            <select id="filter-category" onchange="handleCategoryChange()">
                <option value="ALL">All Categories</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Sub-Category</label>
            <select id="filter-subcategory" onchange="applyFilters()">
                <option value="ALL">All Sub-Categories</option>
            </select>
        </div>

        <div class="filter-group">
            <label>Brand</label>
            <select id="filter-brand" onchange="applyFilters()">
                <option value="ALL">All Brands</option>
            </select>
        </div>
        <!-- Universal Search Bar Below Filters -->
<div class="search-container" style="padding: 0 16px 8px;">
    <input 
        type="text" 
        id="search-input" 
        placeholder="🔍 Search name, category, brand..." 
        oninput="applyFilters()"
        style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;"
    >
</div>

    </section>

    <!-- Product Grid -->
    <main class="content-container">
        <h3 class="section-title">Build Your Custom Combo</h3>
        <div id="product-list" class="product-grid">Loading products...</div>
    </main>

    <!-- Sticky Bottom Cart Sheet -->
    <section id="cart-section" class="cart-card">
        <h3>🛒 Your Combo Selection</h3>
        <ul id="cart-items"></ul>
        
        <div class="combo-tracker">
            <div id="item-count-rule" class="rule-badge">❌ Items: 0 / 3 min</div>
            <div id="price-rule" class="rule-badge">❌ Total: K 0.00 / K 249.00 min</div>
        </div>

        <form id="checkout-form" onsubmit="handleCheckout(event)">
            <label for="workplace-select">Select Office Delivery Point:</label>
            <select id="workplace-select" required>
                <option value="">-- Choose your office --</option>
                <option value="New Government Complex">New Government Complex (Independence Ave)</option>
                <option value="Ministry of Finance">Ministry of Finance (Haile Selassie Ave)</option>
                <option value="Zanaco HQ">Zanaco HQ (Cairo Road)</option>
            </select>

            <label for="customer-phone">WhatsApp Contact Number:</label>
            <input type="tel" id="customer-phone" placeholder="e.g. 0977123456" required>

            <button type="submit" id="checkout-btn" class="btn-primary" disabled>Build Min Combo (3 Items & K249) to Order</button>
        </form>
    </section>

    <script src="app.js"></script>
</body>
</html>
