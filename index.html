<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaDesk - Office Combo Shop</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div><strong>PaDesk</strong> | Custom Office Combos</div>
    </header>

    <div class="delivery-ticker">
        🚛 Gate Delivery: Tuesdays & Thursdays | Min Combo: 3 Items & K249 Total
    </div>

    <main>
        <h2>📦 Build Your Custom Combo</h2>
        <div id="product-list" class="product-grid">Loading products...</div>
    </main>

    <section id="cart-section" class="cart-card">
        <h3>🛒 Your Combo Selection</h3>
        <ul id="cart-items"></ul>
        
        <div class="combo-tracker">
            <p id="item-count-rule">❌ Items selected: 0 / 3 minimum</p>
            <p id="price-rule">❌ Combo total: K 0.00 / K 249.00 minimum</p>
        </div>

        <form id="checkout-form" onsubmit="handleCheckout(event)">
            <label for="workplace-select">Select Delivery Point:</label>
            <select id="workplace-select" required>
                <option value="">-- Choose your office --</option>
                <option value="New Government Complex">New Government Complex (Independence Ave)</option>
                <option value="Ministry of Finance">Ministry of Finance (Haile Selassie Ave)</option>
                <option value="Zanaco HQ">Zanaco HQ (Cairo Road)</option>
            </select>

            <label for="customer-phone">WhatsApp Number:</label>
            <input type="tel" id="customer-phone" placeholder="e.g. 0977123456" required>

            <button type="submit" id="checkout-btn" class="btn-primary" disabled>Build Min. K249 Combo to Order</button>
        </form>
    </section>

    <script src="app.js"></script>
</body>
</html>
