<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaDesk - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #f0f4f8; padding: 20px;">

    <div style="max-width: 900px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.05);">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">📦 Product Master Admin</h2>
            <a href="index.html" style="font-size: 0.85rem; text-decoration: none; color: #0baf65; font-weight: bold;">← Back to Store</a>
        </div>

        <!-- Product Form -->
        <form id="admin-product-form" onsubmit="saveProduct(event)" style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 24px;">
            <input type="hidden" id="product-id">

            <div style="grid-column: span 2;">
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">PRODUCT NAME *</label>
                <input type="text" id="p-name" required class="form-input" placeholder="e.g. Samsung S26 Ultra">
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">PRODUCT CODE / SKU</label>
                <input type="text" id="p-code" class="form-input" placeholder="e.g. EL-S26">
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">BUSINESS (Level 1) *</label>
                <select id="p-business" required class="form-input" onchange="updateAdminCategoryDropdowns()">
                    <option value="">-- Select Business --</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Retail">Retail</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Beauty">Beauty</option>
                </select>
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">CATEGORY (Level 2) *</label>
                <input type="text" id="p-category" required class="form-input" placeholder="e.g. Phones">
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">SUB-CATEGORY (Level 3)</label>
                <input type="text" id="p-subcategory" class="form-input" placeholder="e.g. Smart Phone">
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">REGULAR PRICE (K) *</label>
                <input type="number" step="0.01" id="p-price" required class="form-input" placeholder="0.00">
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">DEAL PRICE (K) [Optional]</label>
                <input type="number" step="0.01" id="p-deal-price" class="form-input" placeholder="0.00">
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">BRAND</label>
                <input type="text" id="p-brand" class="form-input" placeholder="e.g. Samsung">
            </div>

            <div>
                <label style="display:block; font-size:0.75rem; font-weight:700; margin-bottom:4px; color:#4a5568;">IMAGE URL</label>
                <input type="url" id="p-image" class="form-input" placeholder="https://...">
            </div>

            <div style="grid-column: span 2; display: flex; gap: 20px; align-items: center; margin-top: 6px;">
                <label style="font-size: 0.85rem; font-weight: 600;"><input type="checkbox" id="p-active" checked> Active Product</label>
                <label style="font-size: 0.85rem; font-weight: 600;"><input type="checkbox" id="p-featured"> Featured Combo Item</label>
            </div>

            <div style="grid-column: span 2; display: flex; gap: 10px; margin-top: 10px;">
                <button type="submit" class="btn-primary" style="flex: 1; padding: 12px; font-weight: bold;">Save Product</button>
                <button type="button" onclick="resetForm()" style="background: #cbd5e0; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">Cancel</button>
            </div>
        </form>

        <!-- Product Management List Table -->
        <h3>Existing Products</h3>
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
                <thead>
                    <tr style="background: #edf2f7; border-bottom: 2px solid #cbd5e0;">
                        <th style="padding: 10px;">Code</th>
                        <th style="padding: 10px;">Name</th>
                        <th style="padding: 10px;">Business / Cat / Sub</th>
                        <th style="padding: 10px;">Price</th>
                        <th style="padding: 10px; text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-product-table">
                    <!-- Dynamic rows load here -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://cziefuaclocpwicwjprb.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_j_MkiOlGUZOBsR8TSxIM1w_pnQ_B1xx";
        let db;

        window.onload = function() {
            db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            loadAdminProducts();
        };

        async function loadAdminProducts() {
            const { data: products, error } = await db.from('products').select('*').order('id', { ascending: false });
            const tbody = document.getElementById("admin-product-table");
            
            if (error || !products) {
                tbody.innerHTML = `<tr><td colspan="5" style="padding: 10px; color: red;">Error loading products.</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map(p => `
                <tr style="border-bottom: 1px solid #edf2f7;">
                    <td style="padding: 10px;">${p.product_code || '-'}</td>
                    <td style="padding: 10px;"><strong>${p.name}</strong><br><small style="color:#718096">${p.brand || ''}</small></td>
                    <td style="padding: 10px;">
                        <span style="background:#e6f7f0; color:#0baf65; padding:2px 6px; border-radius:4px; font-size:0.7rem; font-weight:bold;">${p.business || 'N/A'}</span> / 
                        ${p.category || '-'} / <small>${p.sub_category || '-'}</small>
                    </td>
                    <td style="padding: 10px;">K ${parseFloat(p.deal_price || p.price).toFixed(2)}</td>
                    <td style="padding: 10px; text-align: center;">
                        <button onclick='editProduct(${JSON.stringify(p)})' style="background:#3182ce; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Edit</button>
                        <button onclick="deleteProduct(${p.id})" style="background:#e53e3e; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Del</button>
                    </td>
                </tr>
            `).join('');
        }

        async function saveProduct(event) {
            event.preventDefault();
            const id = document.getElementById("product-id").value;
            
            const payload = {
                name: document.getElementById("p-name").value.trim(),
                product_code: document.getElementById("p-code").value.trim() || null,
                business: document.getElementById("p-business").value,
                category: document.getElementById("p-category").value.trim(),
                sub_category: document.getElementById("p-subcategory").value.trim() || null,
                price: parseFloat(document.getElementById("p-price").value),
                deal_price: document.getElementById("p-deal-price").value ? parseFloat(document.getElementById("p-deal-price").value) : null,
                brand: document.getElementById("p-brand").value.trim() || null,
                image_url: document.getElementById("p-image").value.trim() || null,
                is_active: document.getElementById("p-active").checked,
                is_featured_combo: document.getElementById("p-featured").checked
            };

            let query = db.from('products');
            if (id) {
                query = query.update(payload).eq('id', id);
            } else {
                query = query.insert([payload]);
            }

            const { error } = await query;
            if (error) {
                alert("Error saving product: " + error.message);
            } else {
                alert("Product saved successfully!");
                resetForm();
                loadAdminProducts();
            }
        }

        function editProduct(p) {
            document.getElementById("product-id").value = p.id;
            document.getElementById("p-name").value = p.name;
            document.getElementById("p-code").value = p.product_code || '';
            document.getElementById("p-business").value = p.business || '';
            document.getElementById("p-category").value = p.category || '';
            document.getElementById("p-subcategory").value = p.sub_category || '';
            document.getElementById("p-price").value = p.price;
            document.getElementById("p-deal-price").value = p.deal_price || '';
            document.getElementById("p-brand").value = p.brand || '';
            document.getElementById("p-image").value = p.image_url || '';
            document.getElementById("p-active").checked = p.is_active;
            document.getElementById("p-featured").checked = p.is_featured_combo;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteProduct(id) {
            if (!confirm("Are you sure you want to delete this product?")) return;
            const { error } = await db.from('products').delete().eq('id', id);
            if (error) alert("Error: " + error.message);
            else loadAdminProducts();
        }

        function resetForm() {
            document.getElementById("admin-product-form").reset();
            document.getElementById("product-id").value = "";
        }
    </script>
</body>
</html>
